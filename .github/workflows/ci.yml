name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure default build
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build default targets
        run: cmake --build build --config Release --parallel

      - name: Test default build
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Configure factory-profile fallback
        run: >
          cmake -S . -B build-no-profile-io
          -DCMAKE_BUILD_TYPE=Release
          -DLIVELOOPING_BUILD_PROFILE_IO=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build factory-profile fallback
        run: cmake --build build-no-profile-io --config Release --parallel

      - name: Test factory-profile fallback
        run: ctest --test-dir build-no-profile-io --build-config Release --output-on-failure
